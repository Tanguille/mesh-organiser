[package]
name = "web"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
db = { workspace = true }

async-trait = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
axum-extra = { workspace = true, features = ["query"] }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "signal",
] }
tokio-util = { workspace = true, features = ["io"] }
axum-login = { workspace = true }
password-auth = { workspace = true }
service = { workspace = true }
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
rmp-serde = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "time"] }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
time = { workspace = true }
tower_governor = { workspace = true }
tower-http = { workspace = true, features = ["compression-gzip", "cors", "fs"] }
tower-sessions = { workspace = true, features = ["signed"] }
# `deletion-task` adds `ExpiredDeletion::continuously_delete_expired`.
tower-sessions-core = { workspace = true, features = ["deletion-task"] }

[dev-dependencies]
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
sha2 = { workspace = true }
tokio-rustls = "0.26"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "test-util"] }
# `util` adds `ServiceExt::oneshot`, to call the MCP router without binding a port.
tower = { workspace = true, features = ["util"] }
zip = { workspace = true }
# Test-only TLS fixtures (see sync_pull_transport_tests.rs); aws_lc_rs matches the rustls provider the tests install, so no ring.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
