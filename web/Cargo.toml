[package]
name = "web"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
db = { workspace = true }

async-trait = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
axum-extra = { workspace = true, features = ["query"] }
tokio = { workspace = true, features = [
    "process",
    "rt-multi-thread",
    "signal",
] }
tokio-util = { workspace = true, features = ["io"] }
axum-login = { workspace = true }
password-auth = { workspace = true }
service = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "time"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
time = { workspace = true }
tower_governor = { workspace = true }
tower-http = { workspace = true, features = ["compression-gzip", "cors", "fs"] }
tower-sessions = { workspace = true, features = ["signed"] }
# `deletion-task` adds `ExpiredDeletion::continuously_delete_expired`.
tower-sessions-core = { workspace = true, features = ["deletion-task"] }
htmlescape = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
