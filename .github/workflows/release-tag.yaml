name: release-tag

# Tags `v<package.json version>`, creates the GitHub Release and dispatches `publish`
# when a release PR merges (see .github/RELEASE.md).

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - Cargo.toml

permissions:
  contents: write
  actions: write # gh workflow run
  issues: write # relabel the merged release-please PR (labels live on the issue API)
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-on-version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read app version
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Skip if tag already exists
        id: check
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}" -m "Mesh Organiser ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release with auto-generated notes
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists."
          else
            # `publish` later attaches the binaries without overwriting these notes.
            gh release create "${{ steps.version.outputs.tag }}" \
              --title "Mesh Organiser ${{ steps.version.outputs.tag }}" \
              --generate-notes
          fi

      # Tags pushed with GITHUB_TOKEN never fire `on: push` workflows (v4.0.0
      # shipped without assets that way), but an API `workflow_dispatch` does.
      - name: Dispatch publish workflow to build and attach assets
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yaml --ref "${{ steps.version.outputs.tag }}" -f releaseType=publish

      # release-please runs with `skip-github-release`, so it never relabels its
      # merged PR; one left on `autorelease: pending` aborts every later run
      # ("untagged, merged release PRs outstanding"). Also runs after a failed
      # step or an existing tag (manual tag, re-run) as long as the tag is on
      # the remote.
      - name: Mark merged release-please PR as tagged
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        # REST rather than `gh pr edit`: adding a label this way creates it if
        # missing, and avoids gh's GraphQL edit path needing extra scopes.
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG not on remote; leaving release PRs pending."
            exit 0
          fi
          # Default release-please title: "chore(main): release X.Y.Z".
          for pr in $(gh pr list --state merged --label "autorelease: pending" --json number,title \
            --jq ".[] | select(.title | endswith(\" release $VERSION\")) | .number"); do
            gh api -X DELETE "repos/{owner}/{repo}/issues/$pr/labels/autorelease:%20pending" >/dev/null
            gh api "repos/{owner}/{repo}/issues/$pr/labels" -f "labels[]=autorelease: tagged" >/dev/null
            echo "Marked #$pr as autorelease: tagged."
          done
