name: Svelte CI

on:
  push:
    branches:
      - main
    paths:
      - "**/*.svelte"
      - "**/*.ts"
      - "**/*.js"
      - "**/*.css"
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "**/*.config.*"
      - "Cargo.toml"
      - ".github/workflows/svelte-ci.yaml"

  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.svelte"
      - "**/*.ts"
      - "**/*.js"
      - "**/*.css"
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "**/*.config.*"
      - "Cargo.toml"
      - "scripts/check-package-cargo-version.mjs"
      - ".github/workflows/svelte-ci.yaml"

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  svelte_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@latest
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Svelte check
        run: pnpm run check

      - name: Prettier check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Build frontend
        run: pnpm run build
