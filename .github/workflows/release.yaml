name: publish

on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: "Release type"
        required: true
        default: "publish"
        type: choice
        options:
          - publish
          - draft
          - build-only
  push:
    tags:
      - "v*"

env:
  MESH_THUMBNAIL_REPO: suchmememanyskill/mesh-thumbnail
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-docker:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release-settings.outputs.tag_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Compute release settings
        id: release-settings
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.releaseType }}" = "build-only" ]; then
              echo "tag_name=" >> $GITHUB_OUTPUT
            else
              # `__VERSION__` is a tauri-action placeholder; docker would push it literally.
              echo "tag_name=v$(jq -r .version package.json)" >> $GITHUB_OUTPUT
            fi
          else
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb # v3.3.0

      - name: Login to Container Registry
        uses: docker/login-action@0d4c9c5ea7693da7b068278f7b52bda2a190a446 # v3.2.0
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=${{ steps.release-settings.outputs.tag_name }},enable=${{ steps.release-settings.outputs.tag_name != '' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.releaseType != 'build-only' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Same as build-tauri: the pnpm version comes from package.json `packageManager`.
      - name: Set up pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@latest
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: release-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute release settings
        id: release-settings
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.releaseType }}" = "build-only" ]; then
              echo "tag_name=" >> $GITHUB_OUTPUT
              echo "upload_workflow_artifacts=true" >> $GITHUB_OUTPUT
            else
              echo "tag_name=v__VERSION__" >> $GITHUB_OUTPUT
              echo "upload_workflow_artifacts=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "upload_workflow_artifacts=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Android APK (arm64)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release-settings.outputs.tag_name }}
          releaseName: "Mesh Organiser Android ${{ steps.release-settings.outputs.tag_name }}"
          releaseBody: "Android APK build"
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.release-csp.json --target aarch64-linux-android --bundles apk

      - name: Upload APK as artifact
        if: steps.release-settings.outputs.upload_workflow_artifacts == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mesh-organiser-android-arm64
          path: src-tauri/target/aarch64-linux-android/release/bundle/apk/*.apk

  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-amd64
            target: x86_64-pc-windows-gnu
            os: windows-latest
            args: "--config src-tauri/tauri.release-csp.json"
          - name: linux-amd64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            args: "--config src-tauri/tauri.release-csp.json"
          - name: macos-amd64
            target: x86_64-apple-darwin
            os: macos-latest
            args: "--config src-tauri/tauri.release-csp.json --target x86_64-apple-darwin"
          - name: macos-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            args: "--config src-tauri/tauri.release-csp.json --target aarch64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify package.json matches Cargo workspace version
        run: node scripts/check-package-cargo-version.mjs

      # Matches svelte-ci.yaml: pnpm version comes from package.json
      # `packageManager`, so a hardcoded `version:` here can't drift from it.
      - name: Set up pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@latest
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      # Matches rust-ci.yaml. dtolnay/rust-toolchain publishes no tags to pin a
      # SHA against; this action is tagged. cache/rustflags are disabled because
      # caching stays with the explicit Swatinem step below, and the release
      # build must not fail on warnings.
      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          cache: false
          rustflags: ""

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release

      - name: Install dependencies (Ubuntu)
        if: matrix.name == 'linux-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Fetch OCCT sources
        if: matrix.name == 'linux-amd64'
        shell: bash
        run: bash scripts/fetch-occt.sh

      - name: Install dependencies (macOS)
        if: matrix.name == 'macos-amd64' || matrix.name == 'macos-arm64'
        run: |
          brew uninstall cmake
          brew tap-new $USER/local-cmake
          brew tap homebrew/core --force
          brew extract --version=3.31.1 cmake $USER/local-cmake
          brew install $USER/local-cmake/cmake@3.31.1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute release settings
        id: release-settings
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.releaseType }}" = "build-only" ]; then
              echo "tag_name=" >> $GITHUB_OUTPUT
              echo "release_name=" >> $GITHUB_OUTPUT
              echo "release_draft=false" >> $GITHUB_OUTPUT
            else
              echo "tag_name=v__VERSION__" >> $GITHUB_OUTPUT
              echo "release_name=Mesh Organiser v__VERSION__" >> $GITHUB_OUTPUT
              if [ "${{ github.event.inputs.releaseType }}" = "draft" ]; then
                echo "release_draft=true" >> $GITHUB_OUTPUT
              else
                echo "release_draft=false" >> $GITHUB_OUTPUT
              fi
            fi
          else
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "release_name=Mesh Organiser ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "release_draft=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release-settings.outputs.tag_name }}
          releaseName: ${{ steps.release-settings.outputs.release_name }}
          releaseBody: "See the assets to download this version and install."
          releaseDraft: ${{ steps.release-settings.outputs.release_draft }}
          prerelease: false
          args: ${{ matrix.args }}
