name: publish

on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: "Release type"
        required: true
        default: "publish"
        type: choice
        options:
          - publish
          - draft
          - build-only
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-amd64
            target: x86_64-pc-windows-gnu
            os: windows-latest
            args: "--config src-tauri/tauri.release-csp.json"
          - name: linux-amd64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            args: "--config src-tauri/tauri.release-csp.json"
          - name: macos-amd64
            target: x86_64-apple-darwin
            os: macos-latest
            args: "--config src-tauri/tauri.release-csp.json --target x86_64-apple-darwin"
          - name: macos-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            args: "--config src-tauri/tauri.release-csp.json --target aarch64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify package.json matches Cargo workspace version
        run: node scripts/check-package-cargo-version.mjs

      # Matches svelte-ci.yaml: pnpm version comes from package.json
      # `packageManager`, so a hardcoded `version:` here can't drift from it.
      - name: Set up pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@latest
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      # Matches rust-ci.yaml. dtolnay/rust-toolchain publishes no tags to pin a
      # SHA against; this action is tagged. cache/rustflags are disabled because
      # caching stays with the explicit Swatinem step below, and the release
      # build must not fail on warnings.
      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          cache: false
          rustflags: ""

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release

      - name: Install dependencies (Ubuntu)
        if: matrix.name == 'linux-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Fetch OCCT sources
        if: matrix.name == 'linux-amd64'
        shell: bash
        run: bash scripts/fetch-occt.sh

      - name: Install dependencies (macOS)
        if: matrix.name == 'macos-amd64' || matrix.name == 'macos-arm64'
        run: |
          brew uninstall cmake
          brew tap-new $USER/local-cmake
          brew tap homebrew/core --force
          brew extract --version=3.31.1 cmake $USER/local-cmake
          brew install $USER/local-cmake/cmake@3.31.1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute release settings
        id: release-settings
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.releaseType }}" = "build-only" ]; then
              echo "tag_name=" >> $GITHUB_OUTPUT
              echo "release_name=" >> $GITHUB_OUTPUT
              echo "release_draft=false" >> $GITHUB_OUTPUT
            else
              echo "tag_name=v__VERSION__" >> $GITHUB_OUTPUT
              echo "release_name=Mesh Organiser v__VERSION__" >> $GITHUB_OUTPUT
              if [ "${{ github.event.inputs.releaseType }}" = "draft" ]; then
                echo "release_draft=true" >> $GITHUB_OUTPUT
              else
                echo "release_draft=false" >> $GITHUB_OUTPUT
              fi
            fi
          else
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "release_name=Mesh Organiser ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "release_draft=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release-settings.outputs.tag_name }}
          releaseName: ${{ steps.release-settings.outputs.release_name }}
          releaseBody: "See the assets to download this version and install."
          releaseDraft: ${{ steps.release-settings.outputs.release_draft }}
          prerelease: false
          args: ${{ matrix.args }}

  # Web server image behind web/README.md's compose file. Skipped for draft and
  # build-only runs: those are dispatched from a branch, so ref_name is not a
  # release tag and `latest` must not move before the release is published.
  docker-image:
    if: github.event_name == 'push' || github.event.inputs.releaseType == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The runtime stage runs apt-get, so arm64 needs emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # ghcr.io requires a lowercase repository; github.repository is `Tanguille/...`.
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VITE_APP_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/tanguille/mesh-organiser:latest
            ghcr.io/tanguille/mesh-organiser:${{ github.ref_name }}
