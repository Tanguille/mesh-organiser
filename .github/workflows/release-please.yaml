name: release-please

# Opens/updates the release PR (see .github/RELEASE.md). `skip-github-release` in
# release-please-config.json stops it tagging itself, which would race `release-tag`
# into skipping the publish dispatch (tag already exists).

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # PRs opened with `GITHUB_TOKEN` trigger no workflows, so CI needs the PAT.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
