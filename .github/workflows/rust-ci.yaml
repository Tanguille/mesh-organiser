name: Rust CI

on:
  push:
    branches:
      - main
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/rust-ci.yaml"

  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/rust-ci.yaml"

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_check:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt, clippy
          cache-on-failure: false
          # cadrum's OCCT build output lives directly under target/, outside the
          # directories cargo's own fingerprinting revalidates on every build. A
          # restored cache can silently carry an incomplete copy of it forward
          # while cargo still considers the crate's build script up to date,
          # so caching target/ here trades a one-time corruption for a
          # recurring one. Always rebuild OCCT from scratch (~25-30 min) instead.
          cache-targets: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: cargo fmt --all -- --check
      - name: Detect unused dependencies
        uses: bnjbvr/cargo-machete@ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2

      # src-tauri ships `step`, so feature unification builds and tests the STEP
      # path in these workspace runs. On Linux this compiles OCCT from source via
      # cadrum (~25-30 min, every run — see the cache-targets: false note above)
      # — see libmeshthumbnail/Cargo.toml for why Linux cannot use the prebuilt
      # tarball.
      - run: cargo build --workspace --all-targets
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace --all-targets
