[workspace]
members = ["db", "libmeshthumbnail", "service", "web", "src-tauri"]
resolver = "3"

[workspace.lints.rust]
unused_qualifications = "warn"

[workspace.lints.clippy]
# Priority is needed so our config below is respected over the pedantic group
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unnecessary_self_imports = "warn"
# Every crate is internal to this workspace and fails with one error type throughout
# (DbError, ServiceError, ...), so per-function errors/panics docs add nothing.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.package]
version = "5.1.1"
edition = "2024"

[workspace.dependencies]
db = { path = "db" }
libmeshthumbnail = { path = "libmeshthumbnail" }
service = { path = "service" }

euc = { git = "https://github.com/zesterer/euc", rev = "e8f7aeec9ff431b373f83de2c773ddf8a2a3ec4d", default-features = false }
cadrum = { version = "0.9.2", default-features = false }
threemf = { version = "0.8.1" }

arboard = { version = "3.7.0", default-features = false }
async_zip = "0.0.19"
base64 = "0.23.1"
fake = { version = "5.1.0", features = ["derive"] }
proptest = "1.12.0"
tempfile = "3.27.0"
vek = "0.17.2"
wavefront_obj = "11.0.0"
zip = "9.8.1"
async-trait = "0.1.92"
axum = "0.8.9"
axum-extra = "0.12.6"
axum-login = "0.19.0"
bitflags = "2.13.2"
chrono = "0.4.45"
futures = "0.3.34"
image = { version = "0.25.10", default-features = false }
indexmap = "2.14.2"
itertools = "0.15.0"
libsqlite3-sys = "0.40.0"
password-auth = "2.0.0"
rand = "0.10.4"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false }
rustix = { version = "1.1.6", features = ["fs"] }
rmcp = "3.11.0"
rmp-serde = "1.3.1"
schemars = "1.2.3"
serde = "1.0.229"
serde_html_form = "0.4.1"
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false }
stl_io = "0.11.0"
strum = "0.28.0"
# `dbus` lets tao read the desktop portal's color-scheme and mirror it into GTK's
# gtk-application-prefer-dark-theme. WebKitGTK derives prefers-color-scheme from that GTK
# setting (or a theme name ending in "-dark"), never from GNOME's color-scheme, so without it
# a GNOME dark-mode user gets light mode.
tauri = { version = "2.12.7", features = ["wry", "dbus"], default-features = false }
tauri-build = { version = "2.7.6", default-features = false }
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
tauri-plugin-http = { version = "2.9.0", features = [
    "cookies",
], default-features = false }
tauri-plugin-opener = "2.7.3"
tauri-plugin-os = "2.4.0"
tauri-plugin-updater = { version = "2.14.1", features = [
    "rustls-tls",
], default-features = false }
tauri-plugin-single-instance = "2.5.5"
thiserror = "2.0.21"
time = "0.3.55"
tokio = "1.54.1"
tokio-util = "0.7.20"
tower = "0.5.3"
tower_governor = "0.8.0"
tower-http = "0.7.1"
tower-sessions = { version = "0.15.0", default-features = false }
tower-sessions-core = { version = "0.15.0", default-features = false }
tracing-subscriber = "0.3.23"
percent-encoding = "2.3.2"
winreg = "0.56.0"
wiremock = "0.6.5"

[profile.release]
strip = true
lto = true
codegen-units = 1
